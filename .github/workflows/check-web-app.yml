name: Smoke test XGBoost sales dashboard
on:
  push:
    branches: [portfolio-web-app, main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Render dashboard with trained XGBoost sample model
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          t=AppTest.from_file("app.py",default_timeout=100).run()
          assert not t.exception,t.exception
          print("XGBoost dashboard passed")
          PY
